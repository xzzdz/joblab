name: CI

# รันทุกครั้งที่ push ขึ้น main และทุก pull request
# จุดประสงค์: จับของพังตั้งแต่ยังอยู่บน GitHub ไม่ใช่ตอน deploy ไปแล้ว
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # เทสต์บางส่วนต่อฐานข้อมูลจริง (tests/authorization.test.ts)
    # เพราะสิ่งที่เทสต์คือเงื่อนไข where ของ Prisma ถ้า mock ทิ้งก็ไม่ได้พิสูจน์อะไร
    # GitHub Actions จึงต้องมี Postgres ให้ใช้ระหว่างรัน
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: joblab
          POSTGRES_PASSWORD: joblab
          POSTGRES_DB: joblab
        ports:
          - 5433:5432
        # รอจน Postgres พร้อมจริงก่อนเริ่ม job ไม่งั้น migrate จะล้มเพราะต่อไม่ติด
        options: >-
          --health-cmd "pg_isready -U joblab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://joblab:joblab@localhost:5433/joblab?schema=public
      # ค่าปลอมสำหรับ CI เท่านั้น — ของจริงอยู่ใน environment ของ Vercel
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # แคช node_modules ตาม package-lock.json ทำให้รอบถัดไปเร็วขึ้นมาก
          cache: npm

      # npm ci ติดตั้งตาม package-lock.json เป๊ะ ๆ (ต่างจาก npm install ที่อัปเวอร์ชันได้)
      # CI ต้องได้ dependency ชุดเดียวกับที่เราทดสอบบนเครื่องเสมอ
      - run: npm ci

      # สร้างตารางจริงจาก migration ที่ commit ไว้
      # ใช้ migrate deploy ไม่ใช่ migrate dev เพราะ deploy ไม่โต้ตอบและไม่สร้าง migration ใหม่
      - run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      # build ก่อน E2E เพราะ E2E ต้องมีแอปที่รันได้
      - run: npm run build

      # ใส่ข้อมูลตัวอย่างให้ E2E มีอะไรให้กด (บัญชีทดสอบ + ประกาศงาน)
      - run: npm run db:seed

      # ติดตั้งแค่ Chromium ตัวเดียว — ครบสำหรับสิ่งที่เราทดสอบและเร็วกว่าโหลดทุกเบราว์เซอร์
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      # เก็บ trace/screenshot ของเทสต์ที่ล้มไว้ดูย้อนหลัง
      # (E2E ที่ล้มบน CI แต่ผ่านบนเครื่องตัวเองคือเรื่องปกติ ต้องมีหลักฐานให้ดู)
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
